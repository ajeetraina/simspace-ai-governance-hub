version: "2.0"

metadata:
  id: ai-governance-hub
  title: "Docker AI Governance - Console + API"
  summary: >
    Read and write Docker AI Governance policies the real way - the Governance
    API (curl to hub.docker.com/v2) for the admin side, and sbx policy commands
    for the developer side - then watch enforcement allow and deny. Simulated, so
    every learner sees the same decisions, with nothing to install.

# ---------------------------------------------------------------------------
# State. `governance.active` models whether the org's policy is synced to this
# machine and enforced (the Manage toggle in the console / `sbx policy reset`).
# It is also wired to a Settings toggle (controls:) so it can be flipped the way
# an admin flips the console switch. Starts OFF to match the console screenshot.
# ---------------------------------------------------------------------------
state:
  org: "whalecollab"
  governance:
    active: false
  sandbox:
    inside: false
  policy:
    blockexfil: false # a policy the learner creates via the API

settings:
  pace:
    net: 500 # simulated request through the sandbox proxy
    sync: 600 # simulated policy sync
    boot: 800 # simulated microVM boot

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

# The Settings toggle (⚙, next to Reset) is the in-lab analog of the console's
# Manage switch: off = the org policy is not enforced on this machine.
controls:
  - id: governance
    label: "AI governance (Manage switch)"
    description: "On = org policy is synced and enforced in every sandbox. Off = sandboxes run ungoverned."
    state: governance.active
    enabled: true
    disabled: false

scenarios:
  # ===========================================================================
  # The Governance API - https://hub.docker.com/v2  (the admin "front door").
  # Endpoints and payloads match docs.docker.com/reference/api/ai-governance.
  # curl matches on the URL (positional arg 0); POST vs GET disambiguates the
  # shared /policies URL, so the more specific POST scenarios come first.
  # ===========================================================================

  # 1. Exchange a username + PAT for a bearer token.
  - id: api-auth
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://hub.docker.com/v2/auth/token"] } }
    then:
      output:
        - { text: "> POST /v2/auth/token", delay: sync }
        - "< HTTP/2 200"
        - '{ "access_token": "eyJhbGciOiJSUzI1Ni␣...␣<jwt>", "token_type": "Bearer" }'
        - ""
        - "Save it as $TOKEN and send it as `Authorization: Bearer $TOKEN` on every call below."

  # 2. Add a rule to an existing policy (must precede the create/list scenarios,
  #    which match the shorter /policies URL as a prefix of this one).
  - id: api-add-rule
    when:
      command: [curl]
      args:
        0: { oneOf: ["https://hub.docker.com/v2/orgs/whalecollab/governance/policies/pol_06gawnt8tw1pzxe3e69y58jsr5df/rules"] }
        -X: { oneOf: [POST] }
    then:
      output:
        - "> POST /v2/orgs/whalecollab/governance/policies/pol_06gawnt8.../rules"
        - "< HTTP/2 201"
        - '{'
        - '  "id": "rule_06evsm9qjm1pdsk0a8nkfaxy7jna",'
        - '  "name": "allow datadog",'
        - '  "actions": ["connect:tcp"],'
        - '  "decision": "allow",'
        - '  "resources": ["api.datadoghq.com"]'
        - '}'

  # 3. Create a policy (allowlist_v0). POST to the /policies collection.
  - id: api-create-policy
    when:
      command: [curl]
      args:
        0: { oneOf: ["https://hub.docker.com/v2/orgs/whalecollab/governance/policies"] }
        -X: { oneOf: [POST] }
    then:
      state: { policy.blockexfil: true }
      output:
        - { text: "> POST /v2/orgs/whalecollab/governance/policies", delay: sync }
        - "< HTTP/2 201"
        - '{'
        - '  "id": "pol_07hxwps57u4sj04fp1833879tneq",'
        - '  "name": "blockexfil",'
        - '  "org": "whalecollab",'
        - '  "scope": { "teams": [] },'
        - '  "allowlist_v0": {'
        - '    "domain": "network",'
        - '    "rules": [ { "id": "rule_07a...", "name": "deny paste sites",'
        - '                 "actions": ["connect:tcp","connect:udp"],'
        - '                 "decision": "deny", "resources": ["paste.ee","pastebin.com"] } ]'
        - '  },'
        - '  "created_at": "2026-11-11T00:00:00Z",'
        - '  "updated_at": "2026-11-11T00:00:00Z"'
        - '}'

  # 4. Get one network policy -> allowlist_v0 with its deny rule.
  - id: api-get-policy-net
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://hub.docker.com/v2/orgs/whalecollab/governance/policies/pol_06gawnt8tw1pzxe3e69y58jsr5df"] } }
    then:
      output:
        - "> GET /v2/orgs/whalecollab/governance/policies/pol_06gawnt8..."
        - "< HTTP/2 200"
        - '{'
        - '  "id": "pol_06gawnt8tw1pzxe3e69y58jsr5df",'
        - '  "name": "denyredingtondbteam",'
        - '  "org": "whalecollab",'
        - '  "scope": { "teams": [] },'
        - '  "allowlist_v0": {'
        - '    "domain": "network",'
        - '    "rules": [ { "id": "rule_06g...", "name": "denyredington",'
        - '                 "actions": ["connect:tcp","connect:udp"],'
        - '                 "decision": "deny", "resources": ["*.mysql.org"] } ]'
        - '  },'
        - '  "created_at": "2026-09-17T00:00:00Z",'
        - '  "updated_at": "2026-09-17T00:00:00Z"'
        - '}'

  # 5. Get the MCP policy -> cedar_v1 (rules encoded as Cedar text).
  - id: api-get-policy-mcp
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://hub.docker.com/v2/orgs/whalecollab/governance/policies/pol_07hk2mcpdemo0github0readonly"] } }
    then:
      output:
        - "> GET /v2/orgs/whalecollab/governance/policies/pol_07hk2mcp..."
        - "< HTTP/2 200"
        - '{'
        - '  "id": "pol_07hk2mcpdemo0github0readonly",'
        - '  "name": "demo-github-readonly",'
        - '  "org": "whalecollab",'
        - '  "scope": { "teams": [] },'
        - '  "cedar_v1": {'
        - '    "schema_url": "https://schemas.docker.com/policy/cedar/v1/mcp/v0",'
        - '    "text": "permit(principal, action == MCP::Action::\\"call_tool\\", resource is MCP::Tool)\\n  when { resource.server == \\"github\\" && resource.tool in [\\"search_repositories\\",\\"get_file_contents\\",\\"list_issues\\"] };"'
        - '  },'
        - '  "created_at": "2026-07-06T00:00:00Z",'
        - '  "updated_at": "2026-07-06T00:00:00Z"'
        - '}'

  # 6. List policies -> the collection for the org.
  - id: api-list-policies
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://hub.docker.com/v2/orgs/whalecollab/governance/policies"] } }
    then:
      output:
        - "> GET /v2/orgs/whalecollab/governance/policies"
        - "< HTTP/2 200"
        - '{ "data": ['
        - '  { "id": "pol_06gawnt8tw1pzxe3e69y58jsr5df", "name": "denyredingtondbteam", "org": "whalecollab" },'
        - '  { "id": "pol_06ddatadog0000000000000000000", "name": "allowdatadog",        "org": "whalecollab" },'
        - '  { "id": "pol_06ffirecrawl00000000000000000", "name": "allowfirecrawl",      "org": "whalecollab" },'
        - '  { "id": "pol_07hk2mcpdemo0github0readonly", "name": "demo-github-readonly", "org": "whalecollab" }'
        - '] }'

  # ===========================================================================
  # The developer side - the real sbx policy commands. Org policy is fetched at
  # login and cached by the local sbx daemon; `sbx policy reset` forces a sync.
  # ===========================================================================
  - id: docker-login
    when:
      command: [docker, login]
    then:
      output: ["Authenticating with existing credentials...", "Login Succeeded"]

  - id: sbx-login-org
    when:
      command: [sbx, login]
      args: { --org: { any: true } }
    then:
      state: { governance.active: true, org: "{{ args.org }}" }
      output:
        - "Opening your browser to authenticate with Docker..."
        - { text: "Login Succeeded", delay: sync }
        - "Synced AI Governance policy for {{ args.org }} (cached locally)."

  - id: sbx-login
    when:
      command: [sbx, login]
    then:
      state: { governance.active: true }
      output:
        - "Opening your browser to authenticate with Docker..."
        - { text: "Login Succeeded", delay: sync }
        - "Synced AI Governance policy for {{ state.org }} (cached locally)."

  - id: sbx-policy-reset
    when:
      command: [sbx, policy, reset]
    then:
      state: { governance.active: true }
      output:
        - { text: "Syncing policy from {{ state.org }}...", delay: sync }
        - "[OK] Policy synced. Org rules are now active on this machine."

  - id: sbx-policy-ls-inactive
    when:
      command: [sbx, policy, ls]
      args: { --include-inactive: { any: true } }
      state: { governance.active: true }
    then:
      output:
        - "Governance: managed by {{ state.org }}"
        - "[OK] last synced 15:54:21"
        - ""
        - "NAME                   TYPE        ORIGIN  DECISION  STATUS    RESOURCES"
        - "denyredingtondbteam    network     remote  deny      active    *.mysql.org"
        - "allowdatadog           network     remote  allow     active    api.datadoghq.com"
        - "allowfirecrawl         network     remote  allow     active    api.firecrawl.dev"
        - "allowcatalog           filesystem  remote  allow     active    ~/workdemo/**"
        - "balanced-net           network     local   allow     inactive  (corporate policy takes precedence)"
        - "balanced-fs            filesystem  local   allow     inactive  (corporate policy takes precedence)"

  - id: sbx-policy-ls-ungoverned
    when:
      command: [sbx, policy, ls]
      state: { governance.active: false }
    then:
      output:
        - "Governance: not managed (no org policy synced)"
        - ""
        - "NAME          TYPE        ORIGIN  DECISION  STATUS  RESOURCES"
        - "balanced-net  network     local   allow     active  (sbx default baseline)"
        - "balanced-fs   filesystem  local   allow     active  (sbx default baseline)"
        - ""
        - "These are local defaults only - nothing is enforced by your org."

  - id: sbx-policy-ls
    when:
      command: [sbx, policy, ls]
    then:
      output:
        - "Governance: managed by {{ state.org }}"
        - "[OK] last synced 15:54:21"
        - ""
        - "NAME                   TYPE        ORIGIN  DECISION  STATUS  RESOURCES"
        - "denyredingtondbteam    network     remote  deny      active  *.mysql.org"
        - "allowdatadog           network     remote  allow     active  api.datadoghq.com"
        - "allowfirecrawl         network     remote  allow     active  api.firecrawl.dev"
        - "allowcatalog           filesystem  remote  allow     active  ~/workdemo/**"
        - ""
        - "Local rules are suppressed under governance. Add --include-inactive to see them."

  - id: sbx-policy-log-json
    when:
      command: [sbx, policy, log]
      args: { --json: { any: true } }
    then:
      output:
        - '{"sandbox":"catalog","host":"api.datadoghq.com","decision":"allow","rule":"allowdatadog","count":12}'
        - '{"sandbox":"catalog","host":"db.mysql.org","decision":"deny","rule":"denyredingtondbteam","count":1}'
        - '{"sandbox":"catalog","host":"example.com","decision":"deny","rule":"default-deny","count":1}'

  - id: sbx-policy-log
    when:
      command: [sbx, policy, log]
    then:
      output:
        - "Blocked requests:"
        - "SANDBOX   TYPE     HOST          RULE                 REASON    COUNT"
        - "catalog   network  db.mysql.org  denyredingtondbteam  explicit  1"
        - "catalog   network  example.com   default-deny         implicit  1"

  - id: sbx-run
    when:
      command: [sbx, run]
      args: { 0: { oneOf: [claude, codex, gemini] } }
    then:
      state: { sandbox.inside: true }
      output:
        - { text: "Creating sandbox with agent '{{ args.0 }}'...", delay: boot }
        - "microVM booted. Outbound traffic is routed through the sbx proxy that enforces org network policy."
        - "You are now INSIDE the sandbox. Try the enforcement tests, then run `exit` to leave."

  - id: shell-exit
    when:
      command: [exit]
      state: { sandbox.inside: true }
    then:
      state: { sandbox.inside: false }
      output: ["Leaving sandbox. Back on the host."]

  # ===========================================================================
  # Enforcement: the same request, governed vs ungoverned. Governed by state so
  # flipping the Manage switch (or `sbx policy reset`/`sbx login`) changes it.
  # ===========================================================================
  - id: curl-mysql-governed
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://db.mysql.org", "db.mysql.org", "https://db.mysql.org:3306"] } }
      state: { governance.active: true }
    then:
      output:
        - { text: "* Trying db.mysql.org...", delay: net }
        - "* Request evaluated by the sbx proxy against org policy"
        - "< HTTP/1.1 403 Forbidden   (matched 'denyredingtondbteam': deny connect:tcp,udp *.mysql.org)"
      exit: 1

  - id: curl-mysql-ungoverned
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://db.mysql.org", "db.mysql.org", "https://db.mysql.org:3306"] } }
    then:
      output:
        - { text: "* Trying db.mysql.org...", delay: net }
        - "* No org policy synced - request is NOT evaluated (ungoverned)"
        - "< HTTP/1.1 200 OK   (enable governance to block this)"

  - id: curl-datadog-governed
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://api.datadoghq.com", "api.datadoghq.com"] } }
      state: { governance.active: true }
    then:
      output:
        - { text: "* Trying api.datadoghq.com...", delay: net }
        - "< HTTP/1.1 200 OK   (allowed by 'allowdatadog')"

  - id: curl-datadog
    when:
      command: [curl]
      args: { 0: { oneOf: ["https://api.datadoghq.com", "api.datadoghq.com"] } }
    then:
      output:
        - { text: "* Trying api.datadoghq.com...", delay: net }
        - "< HTTP/1.1 200 OK"
